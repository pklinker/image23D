[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole session. The SQLAlchemy async engine and the
# redis client in worker.app.tasks are both created at import time; a
# per-test loop would leave them holding connections bound to a dead one.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
